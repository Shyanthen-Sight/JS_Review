<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <button onclick="playGame('heads')">heads</button>
  <button onclick="playGame('tails')">tails</button>
  <p class="js-result"></p>
  <p class="js-score"></p>
  <script>
    const score = JSON.parse(localStorage.getItem('score')) || {
      wins: 0,
      losses: 0
    };

    displayScore();

    function playGame(guess) {
      //computer caculation
      const randomNumber = Math.random();
      const result = randomNumber < 0.5 ? 'heads' : 'tails';
      //judgement
      const message = guess === result ? 'You win!' : 'You lose!';
      //output
      document.querySelector('.js-result').innerText = message;
      console.log(message);
      //score caculation
      if (guess === result) { score.wins++ }
      else { score.losses++ }
      console.log(score);
      //storage
      localStorage.setItem('score', JSON.stringify(score))
      displayScore();
    }

    

    function displayScore() {
      document.querySelector('.js-score').innerHTML = `Win${score.wins}-losses${score.losses}`
    }




  </script>
</body>

</html>
