<!DOCTYPE html>
<html>
  <head>
    <title>Cart Quantity</title>
  </head>
  <body>

    <button onclick="
      show();
      ">Show Quantity</button>

    <button onclick="
      cartQuantity++;
      show();
    ">Add to Cart</button>

    <button onclick="
      cartQuantity +=2 ;
      show();
    ">+2</button>

    <button onclick="
      cartQuantity +=3;
      show();
    ">+3</button>

    <button onclick="
      cartQuantity = 0;
      show();
    ">Reset Cart</button>

    <script>
      let cartQuantity = 0;
      const show=()=>{
        console.log(`Cart Quantity:${cartQuantity}`);
      }
    </script>

  </body>
</html>
